
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <main class="bmi-container">

        <section class="bmi-card">

            <!-- Header -->
            <header class="card-header">
                <h1>BMI Calculator</h1>
                <p>Check your Body Mass Index</p>
            </header>

            <!-- Calculator Form -->
            <form class="bmi-form" id="bmiForm">

                <div class="input-group">
                    <label for="height">Height</label>

                    <div class="input-wrapper">
                        <input
                            type="number"
                            id="height"
                            name="height"
                            placeholder="Enter your height"
                            min="1"
                            step="any"
                        >
                        <span class="unit">CM</span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="weight">Weight</label>

                    <div class="input-wrapper">
                        <input
                            type="number"
                            id="weight"
                            name="weight"
                            placeholder="Enter your weight"
                            min="1"
                            step="any"
                        >
                        <span class="unit">KG</span>
                    </div>
                </div>

                <button type="submit" id="calculateBtn">
                    Calculate BMI
                </button>

            </form>

            <!-- Result Section -->
            <section class="result-section" id="resultSection">

                <h2>Your BMI Result</h2>

                <div class="result-value" id="bmiValue">
                    --
                </div>

                <div class="result-status" id="bmiStatus">
                    --
                </div>

                <p class="result-message" id="bmiCategory">
                    Enter your details to calculate your BMI.
                </p>

            </section>

            <!-- BMI Guide -->
            <section class="bmi-guide">

                <h2>BMI Weight Guide</h2>

                <div class="guide-list">

                    <div class="guide-item">
                        <span class="category-dot underweight"></span>
                        <span>Underweight</span>
                        <strong>Below 18.5</strong>
                    </div>

                    <div class="guide-item">
                        <span class="category-dot normal"></span>
                        <span>Normal Weight</span>
                        <strong>18.5 – 24.9</strong>
                    </div>

                    <div class="guide-item">
                        <span class="category-dot overweight"></span>
                        <span>Overweight</span>
                        <strong>25 – 29.9</strong>
                    </div>

                    <div class="guide-item">
                        <span class="category-dot obese"></span>
                        <span>Obesity</span>
                        <strong>30 or above</strong>
                    </div>

                </div>

            </section>

            <!-- Footer -->
            <footer class="card-footer">
                <p>BMI Calculator &copy; 2026</p>
            </footer>

        </section>

    </main>
    <script src="js/script.js" ></script>
</body>
</html>
